<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>商品型錄</title>
<style>
:root{--bg:#f4f5f2;--card:#fff;--ink:#1f2523;--muted:#66706c;--line:#dfe3df;--brand:#3b64a8;--brand-ink:#fff;--soft:#e6ecf6}
@media (prefers-color-scheme: dark){:root{--bg:#121614;--card:#1c2220;--ink:#e7ece9;--muted:#9aa5a0;--line:#2e3633;--brand:#86a9e6;--brand-ink:#0d1412;--soft:#232b38}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
header,main{max-width:720px;margin:0 auto;padding:0 16px}
header{padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:6px}
h1{font-size:22px;margin:0}
.muted{color:var(--muted)}.small{font-size:13px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-height:44px}
textarea{min-height:64px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:5px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.card{background:var(--card);border-radius:12px;padding:4px 14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05)}
.it{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.ttl{font-weight:600}
.price{font-weight:700;font-variant-numeric:tabular-nums;margin-right:4px}
.q{width:36px;height:36px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;font-size:20px;line-height:1;padding:0}
.q:disabled{opacity:.35}
.n{min-width:24px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.sold{color:var(--muted);font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.btn{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;background:var(--brand);color:var(--brand-ink)}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.line{background:#06c755;color:#fff}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btnrow .btn{flex:1}
.empty{color:var(--muted);text-align:center;padding:18px 0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
</style>
</head>
<body>
<header><h1 id="ttl"></h1><div class="small muted" id="sub"></div></header>
<main>
  <div id="note" class="small" style="white-space:pre-wrap"></div>
  <input id="q" type="search" placeholder="搜尋商品" style="margin-top:8px">
  <div class="chips" id="depts"></div>
  <div class="card" id="list"></div>
  <section id="form" class="card" style="padding:14px" hidden>
    <h2 style="font-size:18px;margin:0 0 6px">填寫訂單</h2>
    <div id="sum" class="small"></div>
    <label>姓名 *</label><input id="nm" autocomplete="name">
    <label>電話 *</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel">
    <label>備註 (取貨時間、地點)</label><textarea id="nt"></textarea>
    <div class="btnrow"><button class="btn line" id="send">用 LINE 傳送訂單</button></div>
    <div class="btnrow"><button class="btn ghost" id="copy">複製訂單文字</button><button class="btn ghost" id="clr">清空購物車</button></div>
    <p class="small muted" id="how"></p>
  </section>
</main>
<div class="bar"><div class="in"><div class="grow"><b id="tot"></b><div class="small muted" id="cnt"></div></div><button class="btn" id="go">填寫訂單</button></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const D = {"title":"[你會紅]火龍果園","note":"","line":"","showQty":true,"date":"2026-10-28","items":[{"i":3,"n":"香芋","d":"食","c":"蔬果","u":"斤","p":59,"q":0,"r":[]},{"i":2,"n":"香豔火龍果 (半斤/顆)","d":"食","c":"蔬果","u":"個","p":29,"q":0,"r":[]}]};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (Math.round((n || 0) * 100) / 100).toLocaleString('zh-TW');
const roc = iso => (Number(iso.slice(0, 4)) - 1911) + '.' + iso.slice(5, 7) + '.' + iso.slice(8, 10);
const LS = 'catalog_' + D.title;
const byId = id => D.items.find(x => x.i === id);
let cart = {}, dept = '';
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2400); }
function save() { try { localStorage.setItem(LS, JSON.stringify({ cart, nm: $('#nm').value, ph: $('#ph').value })); } catch (e) { } }
try { const s = JSON.parse(localStorage.getItem(LS) || '{}'); cart = s.cart || {}; $('#nm').value = s.nm || ''; $('#ph').value = s.ph || ''; } catch (e) { }
for (const k of Object.keys(cart)) { const it = byId(Number(k)); if (!it || it.q <= 0) delete cart[k]; else if (cart[k] > it.q) cart[k] = it.q; }

document.title = D.title + ' 商品型錄';
$('#ttl').textContent = D.title;
$('#sub').textContent = '更新日期 ' + roc(D.date) + ' · 共 ' + D.items.length + ' 項商品';
$('#note').textContent = D.note || '';
$('#how').textContent = D.line && D.line[0] === '@' ? '按「用 LINE 傳送訂單」會開啟 ' + D.line + ' 的聊天室，訂單文字已填好，按送出即可。'
  : '按「用 LINE 傳送訂單」後，選擇' + (D.line ? '店家 (LINE ID：' + D.line + ') ' : '店家') + '的聊天室送出；也可以複製訂單文字自行貼上。';
const depts = [...new Set(D.items.map(x => x.d))];

function lines() { return Object.keys(cart).map(k => ({ it: byId(Number(k)), n: cart[k] })).filter(l => l.it && l.n > 0); }
function chips() { $('#depts').innerHTML = depts.length > 1 ? ['', ...depts].map(d => '<button class="chip' + (dept === d ? ' on' : '') + '" data-d="' + esc(d) + '">' + esc(d || '全部') + '</button>').join('') : ''; }
function list() {
  const q = $('#q').value.trim().toLowerCase();
  const arr = D.items.filter(x => (!dept || x.d === dept) && (!q || (x.n + ' ' + x.c).toLowerCase().includes(q)));
  $('#list').innerHTML = arr.map(x => {
    const n = cart[x.i] || 0, out = x.q <= 0;
    return '<div class="it"><div class="grow"><div class="ttl">' + esc(x.n) + '</div><div class="small muted">' +
      esc([x.c, x.u ? '每' + x.u : '', D.showQty && !out ? '尚有 ' + fmt(x.q) : ''].filter(Boolean).join(' · ')) + '</div>' +
      (x.r && x.r.length ? '<div class="small" style="color:var(--brand)">' + esc(x.r.join(' · ')) + '</div>' : '') + '</div>' +
      '<div class="price">$' + fmt(x.p) + '</div>' +
      (out ? '<span class="sold">已售完</span>' : '<button class="q" data-m="' + x.i + '"' + (n ? '' : ' disabled') + '>−</button><span class="n">' + n +
        '</span><button class="q" data-p="' + x.i + '"' + (n >= x.q ? ' disabled' : '') + '>＋</button>') + '</div>';
  }).join('') || '<div class="empty">沒有符合的商品</div>';
  total();
}
function total() {
  const ls = lines(), cnt = ls.reduce((s, l) => s + l.n, 0), amt = ls.reduce((s, l) => s + l.n * l.it.p, 0);
  $('#tot').textContent = cnt ? '合計 $' + fmt(amt) : '尚未選購';
  $('#cnt').textContent = cnt ? ls.length + ' 項 · ' + fmt(cnt) + ' 件' : '點 ＋ 加入商品';
  $('#go').disabled = !cnt;
  $('#sum').innerHTML = ls.map(l => esc(l.it.n) + ' × ' + fmt(l.n) + ' = $' + fmt(l.n * l.it.p)).join('<br>') + (cnt ? '<br><b>合計 $' + fmt(amt) + '</b> <span class="muted">(定價)</span>' : '') +
    (ls.some(l => l.it.r && l.it.r.length) ? '<br><span class="muted">符合條件的優惠價，店家確認訂單時會再計算。</span>' : '');
  if (!cnt) $('#form').hidden = true;
}
$('#list').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const id = Number(b.dataset.p || b.dataset.m), it = byId(id);
  cart[id] = Math.max(0, Math.min(it.q, (cart[id] || 0) + (b.dataset.p ? 1 : -1)));
  if (!cart[id]) delete cart[id];
  save(); list();
};
$('#depts').onclick = e => { const c = e.target.closest('.chip'); if (c) { dept = c.dataset.d; chips(); list(); } };
$('#q').oninput = list;
$('#go').onclick = () => { $('#form').hidden = false; $('#form').scrollIntoView({ behavior: 'smooth' }); };
$('#nm').oninput = $('#ph').oninput = save;

// 訂單文字格式 : 家用進銷存「貼上會員訂單」依 #編號 品名 x 數量 @ 單價 讀回
function orderText() {
  const ls = lines(); if (!ls.length) { toast('請先選購商品'); return ''; }
  const nm = $('#nm').value.trim(), ph = $('#ph').value.trim();
  if (!nm || !ph) { toast('請填寫姓名和電話'); (nm ? $('#ph') : $('#nm')).focus(); return ''; }
  save();
  const nt = $('#nt').value.trim().replace(/\s*\n\s*/g, ' ');
  const amt = ls.reduce((s, l) => s + l.n * l.it.p, 0), cnt = ls.reduce((s, l) => s + l.n, 0);
  return ['【訂單】' + D.title, '姓名：' + nm, '電話：' + ph, nt ? '備註：' + nt : '', '----',
    ...ls.map(l => '#' + l.it.i + ' ' + l.it.n + ' x ' + l.n + ' @ ' + l.it.p + ' = ' + Math.round(l.n * l.it.p * 100) / 100),
    '----', '合計 ' + cnt + ' 件 $' + fmt(amt)].filter(Boolean).join('\n');
}
$('#send').onclick = () => {
  const t = orderText(); if (!t) return;
  location.href = D.line && D.line[0] === '@' ? 'https://line.me/R/oaMessage/' + encodeURIComponent(D.line) + '/?' + encodeURIComponent(t)
    : 'https://line.me/R/share?text=' + encodeURIComponent(t);
};
$('#copy').onclick = () => {
  const t = orderText(); if (!t) return;
  const ok = () => toast('已複製，請貼到 LINE 傳給店家');
  const old = () => { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('無法複製'); } a.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, old); else old();
};
$('#clr').onclick = () => { if (confirm('清空購物車？')) { cart = {}; save(); list(); } };
chips(); list();
</script>
</body>
</html>
